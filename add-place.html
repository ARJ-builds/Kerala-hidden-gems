<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Kerala Hidden Gems</title><link rel="stylesheet" href="styles.css"></head><body class="adminpage">
<aside><a class="brand" href="index.html">🌴 Kerala <b>Hidden Gems</b></a><p>● Admin Mode</p><a class="selected" href="add-place.html">＋ Add Place</a><a href="places.html">◫ Manage Places</a><a href="index.html">↗ View Website</a><small>This prototype stores data in this browser. A real shared admin system needs a backend.</small></aside>
<main class="adminmain"><div class="title"><div><small>ADMIN PANEL</small><h1>Add a New Place</h1><p>Share another hidden gem of Kerala.</p></div><a class="btn" href="places.html">View Places</a></div>
<form id="form"><label>Place Name *<input name="name" required placeholder="e.g. Meenmutty Waterfalls"></label><label>District *<select name="district" id="district" required></select></label><label>Category *<select name="category" id="category" required></select></label><label>Best Time<input name="time" placeholder="October – February"></label><label>Estimated Cost<input name="cost" placeholder="₹100 – ₹500"></label><label>Crowd Note<input name="crowd" placeholder="Usually quiet on weekdays"></label>
<label>Description *<textarea name="description" required rows="5"></textarea></label><label>Location / Google Maps Link<input name="maps"></label><label>How to Reach<textarea name="reach" rows="4"></textarea></label><label>Highlights<textarea name="highlights" rows="4"></textarea></label>
<div class="upload"><label>Cover Image *<input id="cover" type="file" accept="image/*" required></label><label>Gallery Images<input id="gallery" type="file" accept="image/*" multiple></label></div><div id="preview"></div><button class="save">💾 Save Place</button><p id="msg"></p></form></main><script src="app.js"></script></body></html>
